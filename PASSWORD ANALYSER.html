<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Security & Analyzer Tool</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-bottom: 8px;
            font-size: 1.5rem;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .meter-container {
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .metrics {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .strength-label {
            font-weight: bold;
        }

        .feedback-list {
            list-style: none;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .feedback-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-box {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .box-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .generated-output {
            display: flex;
            gap: 8px;
        }

        .alt-pass {
            font-family: monospace;
            font-size: 1rem;
            color: var(--success-color);
            word-break: break-all;
            user-select: all;
            flex-grow: 1;
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-full {
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary {
            background-color: #334155;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔒 Password Security Analyzer</h2>
    <p class="subtitle">Analyze strength or generate secure alternatives</p>

    <div class="input-group">
        <label for="password">Enter Password</label>
        <input type="password" id="password" placeholder="Type password here..." oninput="analyzePassword()">
    </div>

    <div class="meter-container">
        <div id="meter" class="meter-bar"></div>
    </div>

    <div class="metrics">
        <span>Strength: <span id="strength-text" class="strength-label">None</span></span>
        <span>Entropy: <span id="entropy-text">0</span> bits</span>
    </div>

    <ul id="feedback" class="feedback-list"></ul>

    <button class="btn btn-full" onclick="savePassword()">Save Password to History Vault</button>

    <div class="section-box">
        <div class="box-title">⚡ Strong Password Generator</div>
        <div class="generated-output">
            <div id="alt-password" class="alt-pass">Click generate below</div>
            <button class="btn btn-secondary" onclick="copySuggested()">Copy</button>
        </div>
        <button class="btn btn-full" style="background-color: var(--success-color);" onclick="generateNewSuggestion()">Generate New Password</button>
    </div>
</div>

<script>
    // Local memory set to track password history
    const passwordVault = new Set();

    async function hashPassword(input) {
        const encoder = new TextEncoder();
        const data = encoder.encode(input);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function calculateEntropy(password) {
        let poolSize = 0;
        if (/[a-z]/.test(password)) poolSize += 26;
        if (/[A-Z]/.test(password)) poolSize += 26;
        if (/[0-9]/.test(password)) poolSize += 10;
        if (/[^a-zA-Z0-9]/.test(password)) poolSize += 32;

        if (poolSize === 0 || password.length === 0) return 0;
        return Math.round(password.length * Math.log2(poolSize));
    }

    function generateAlternative(length = 16) {
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=";
        let result = "";
        const array = new Uint32Array(length);
        crypto.getRandomValues(array);
        for (let i = 0; i < length; i++) {
            result += chars[array[i] % chars.length];
        }
        return result;
    }

    function generateNewSuggestion() {
        const suggested = generateAlternative();
        document.getElementById("alt-password").innerText = suggested;
    }

    function copySuggested() {
        const text = document.getElementById("alt-password").innerText;
        if (text && text !== "Click generate below") {
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard!");
        }
    }

    async function analyzePassword() {
        const pwd = document.getElementById("password").value;
        const meter = document.getElementById("meter");
        const strengthText = document.getElementById("strength-text");
        const entropyText = document.getElementById("entropy-text");
        const feedbackList = document.getElementById("feedback");

        feedbackList.innerHTML = "";

        if (!pwd) {
            meter.style.width = "0%";
            strengthText.innerText = "None";
            strengthText.style.color = "inherit";
            entropyText.innerText = "0";
            return;
        }

        const entropy = calculateEntropy(pwd);
        entropyText.innerText = entropy;

        // Check password history reuse via hash
        const pwdHash = await hashPassword(pwd);
        const isReused = passwordVault.has(pwdHash);

        // Feedback rules
        const checks = [
            { cond: pwd.length >= 12, msg: "At least 12 characters long" },
            { cond: /[a-z]/.test(pwd), msg: "Contains lowercase letters" },
            { cond: /[A-Z]/.test(pwd), msg: "Contains uppercase letters" },
            { cond: /[0-9]/.test(pwd), msg: "Contains numbers" },
            { cond: /[^a-zA-Z0-9]/.test(pwd), msg: "Contains special characters" },
        ];

        checks.forEach(check => {
            const li = document.createElement("li");
            li.innerHTML = check.cond ? `<span>✅</span> ${check.msg}` : `<span style="color: var(--danger-color)">❌</span> ${check.msg}`;
            feedbackList.appendChild(li);
        });

        if (isReused) {
            const li = document.createElement("li");
            li.innerHTML = `<span style="color: var(--danger-color)">⚠️</span> <b>REUSE WARNING: Previously saved password!</b>`;
            feedbackList.appendChild(li);
        }

        // Strength Calculation & Visual Meter
        let strength = "Very Weak";
        let color = "var(--danger-color)";
        let width = "20%";

        if (entropy >= 28 && entropy < 36) {
            strength = "Weak"; width = "40%"; color = "var(--warning-color)";
        } else if (entropy >= 36 && entropy < 60) {
            strength = "Reasonable"; width = "65%"; color = "var(--accent-color)";
        } else if (entropy >= 60) {
            strength = "Strong"; width = "100%"; color = "var(--success-color)";
        }

        meter.style.width = width;
        meter.style.backgroundColor = color;
        strengthText.innerText = strength;
        strengthText.style.color = color;

        // Automatically update generator suggestion if current password is weak/reused
        if (entropy < 60 || isReused) {
            generateNewSuggestion();
        }
    }

    async function savePassword() {
        const pwd = document.getElementById("password").value;

        if (!pwd) {
            alert("Enter a password first.");
            return;
        }

        const pwdHash = await hashPassword(pwd);
        if (passwordVault.has(pwdHash)) {
            alert("This password is already saved in history!");
        } else {
            passwordVault.add(pwdHash);
            alert("Password hash successfully stored in local vault history.");
            analyzePassword();
        }
    }

    // Initialize generator display on load
    generateNewSuggestion();
</script>
</body>
</html>
